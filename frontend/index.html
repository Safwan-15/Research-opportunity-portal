<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Research Opportunity Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-3">University Research Opportunity Portal</h2>
    <div id="msg"></div>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header" id="formTitle">Add Research Opportunity</div>
                <div class="card-body">
                    <form id="oppForm" novalidate></form>
                </div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="card mb-4">
                <div class="card-header">All Opportunities</div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead>
                            <tr><th>Title</th><th>Faculty</th><th>Deadline</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="list"></tbody>
                    </table>
                </div>
            </div>
            <div class="card d-none" id="detailsCard">
                <div class="card-header">Opportunity Details</div>
                <div class="card-body" id="details"></div>
            </div>
        </div>
    </div>
</div>

<script>
const API = "http://127.0.0.1:5000/api/opportunities";
const fields = [
    ["title", "Research Title", "text"],
    ["description", "Description", "textarea"],
    ["research_area", "Research Area", "text"],
    ["faculty_name", "Faculty Member Name", "text"],
    ["department", "Department", "text"],
    ["required_skills", "Required Skills", "text"],
    ["positions", "Available Positions", "number"],
    ["deadline", "Application Deadline", "date"]
];
let editId = null;

const form = document.getElementById("oppForm");
form.innerHTML = fields.map(([id, label, type]) => `
    <div class="mb-2">
        <label class="form-label" for="${id}">${label}</label>
        ${type === "textarea"
            ? `<textarea class="form-control" id="${id}" rows="3"></textarea>`
            : `<input class="form-control" id="${id}" type="${type}" ${type === "number" ? 'min="1"' : ""}>`}
        <div class="invalid-feedback">${label} is required</div>
    </div>`).join("") + `
    <div class="mb-3">
        <label class="form-label" for="status">Status</label>
        <select class="form-select" id="status">
            <option>Open</option>
            <option>Closed</option>
        </select>
    </div>
    <button class="btn btn-primary" type="submit" id="submitBtn">Add Opportunity</button>
    <button class="btn btn-secondary d-none" type="button" id="cancelBtn">Cancel</button>`;

function esc(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

function showMsg(text, type) {
    document.getElementById("msg").innerHTML =
        `<div class="alert alert-${type} alert-dismissible">${esc(text)}
         <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
    setTimeout(() => (document.getElementById("msg").innerHTML = ""), 5000);
}

async function api(url, options) {
    try {
        const res = await fetch(url, options);
        const data = await res.json();
        if (!res.ok) {
            throw new Error(data.errors ? data.errors.join(", ") : data.error);
        }
        return data;
    } catch (err) {
        showMsg(err.message === "Failed to fetch" ? "Cannot reach the server" : err.message, "danger");
        return null;
    }
}

async function loadAll() {
    const data = await api(API);
    if (!data) return;
    document.getElementById("list").innerHTML = data.length
        ? data.map(o => `
            <tr>
                <td>${esc(o.title)}</td>
                <td>${esc(o.faculty_name)}</td>
                <td>${o.deadline}</td>
                <td><span class="badge bg-${o.status === "Open" ? "success" : "secondary"}">${o.status}</span></td>
                <td class="text-nowrap">
                    <button class="btn btn-sm btn-info" onclick="viewOne(${o.id})">View</button>
                    <button class="btn btn-sm btn-warning" onclick="startEdit(${o.id})">Edit</button>
                    ${o.status === "Open" ? `<button class="btn btn-sm btn-dark" onclick="closeOne(${o.id})">Close</button>` : ""}
                    <button class="btn btn-sm btn-danger" onclick="deleteOne(${o.id})">Delete</button>
                </td>
            </tr>`).join("")
        : `<tr><td colspan="5" class="text-center text-muted">No opportunities found</td></tr>`;
}

async function viewOne(id) {
    const o = await api(`${API}/${id}`);
    if (!o) return;
    document.getElementById("detailsCard").classList.remove("d-none");
    document.getElementById("details").innerHTML = `
        <h5>${esc(o.title)}</h5>
        <p>${esc(o.description)}</p>
        <ul class="list-unstyled mb-0">
            <li><b>ID:</b> ${o.id}</li>
            <li><b>Area:</b> ${esc(o.research_area)}</li>
            <li><b>Faculty:</b> ${esc(o.faculty_name)}</li>
            <li><b>Department:</b> ${esc(o.department)}</li>
            <li><b>Skills:</b> ${esc(o.required_skills)}</li>
            <li><b>Positions:</b> ${o.positions}</li>
            <li><b>Deadline:</b> ${o.deadline}</li>
            <li><b>Status:</b> ${o.status}</li>
        </ul>`;
}

async function startEdit(id) {
    const o = await api(`${API}/${id}`);
    if (!o) return;
    fields.forEach(([key]) => (document.getElementById(key).value = o[key]));
    document.getElementById("status").value = o.status;
    editId = id;
    document.getElementById("formTitle").textContent = `Update Opportunity #${id}`;
    document.getElementById("submitBtn").textContent = "Update Opportunity";
    document.getElementById("cancelBtn").classList.remove("d-none");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
    form.reset();
    form.querySelectorAll(".is-invalid").forEach(el => el.classList.remove("is-invalid"));
    editId = null;
    document.getElementById("formTitle").textContent = "Add Research Opportunity";
    document.getElementById("submitBtn").textContent = "Add Opportunity";
    document.getElementById("cancelBtn").classList.add("d-none");
}

async function closeOne(id) {
    const data = await api(`${API}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: "Closed" })
    });
    if (data) {
        showMsg("Opportunity closed successfully", "success");
        loadAll();
    }
}

async function deleteOne(id) {
    if (!confirm("Delete this opportunity?")) return;
    const data = await api(`${API}/${id}`, { method: "DELETE" });
    if (data) {
        showMsg(data.message, "success");
        document.getElementById("detailsCard").classList.add("d-none");
        loadAll();
    }
}

form.addEventListener("submit", async e => {
    e.preventDefault();
    let valid = true;
    const payload = {};
    fields.forEach(([key]) => {
        const el = document.getElementById(key);
        payload[key] = el.value.trim();
        const bad = payload[key] === "" || (key === "positions" && Number(payload[key]) < 1);
        el.classList.toggle("is-invalid", bad);
        if (bad) valid = false;
    });
    if (!valid) {
        showMsg("Please fill in all required fields correctly", "warning");
        return;
    }
    payload.positions = Number(payload.positions);
    payload.status = document.getElementById("status").value;
    const data = await api(editId ? `${API}/${editId}` : API, {
        method: editId ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });
    if (data) {
        showMsg(editId ? "Opportunity updated successfully" : "Opportunity created successfully", "success");
        resetForm();
        loadAll();
    }
});

document.getElementById("cancelBtn").addEventListener("click", resetForm);
loadAll();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
